name: Interactive SSH Runner (Termux/JuiceSSH)

on:
  workflow_dispatch:

jobs:
  ssh-session:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install & Start Tmate
        run: |
          sudo apt-get update && sudo apt-get install -y tmate
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          
          # Ambil perintah SSH dan Web Terminal
          SSH_CMD=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          WEB_URL=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}')
          
          echo "SSH_CMD=$SSH_CMD"
          echo "WEB_URL=$WEB_URL"
          
          # Simpan ke environment variables GitHub Actions
          echo "SSH_CMD=$SSH_CMD" >> $GITHUB_ENV
          echo "WEB_URL=$WEB_URL" >> $GITHUB_ENV

      - name: Send SSH Access to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🚀 *Sesi SSH GitHub Actions Siap!*
            
            📲 **Salin Perintah Ini ke Termux:**
            ```bash
            ${{ env.SSH_CMD }}
            ```
            
            🌐 **Atau Akses via Web Browser:**
            ${{ env.WEB_URL }}
            
            ⏱️ *Sesi akan aktif hingga kamu menutup sesi (`exit`) atau batas waktu 6 jam.*

      - name: Keep Workflow Alive
        run: |
          echo "Sesi SSH aktif. Menunggu koneksi atau hingga kamu menutup sesi..."
          # Looping untuk mengecek apakah sesi tmate masih hidup tanpa butuh TTY
          while tmate -S /tmp/tmate.sock has-session 2>/dev/null; do
            sleep 10
          done
          echo "Sesi tmate telah ditutup."
          
