name: Interactive SSH Runner (Termux/JuiceSSH)

on:
  workflow_dispatch:

jobs:
  ssh-session:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean Space & Setup Swap (Safe Method)
        run: |
          echo "Membersihkan bloatware untuk mengosongkan ruang..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          
          echo "Membuat Swap 4GB..."
          sudo swapoff -a || true
          sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Pre-install Essential Tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmate htop speedtest-cli git aria2 curl wget zip unzip ccache python3-pip
          
          # Unduh fastfetch dengan opsi -fsSL untuk memastikan error tertangkap jika link broken
          if curl -fsSL https://github.com/fastfetch-cli/fastfetch/releases/latest/download/fastfetch-linux-amd64.deb -o fastfetch.deb; then
            sudo dpkg -i fastfetch.deb || sudo apt-get install -f -y
            rm -f fastfetch.deb
          else
            echo "⚠️ Gagal mengunduh fastfetch, melewati instalasi fastfetch."
          fi

      - name: Start Tmate Session
        run: |
          tmate -S /tmp/tmate.sock new-session -d
          
          echo "Menunggu koneksi tmate server siap..."
          if ! tmate -S /tmp/tmate.sock wait tmate-ready; then
            echo "❌ Gagal menghubungkan ke server tmate."
            exit 1
          fi
          
          SSH_CMD=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          WEB_URL=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}')
          
          echo "SSH_CMD=$SSH_CMD" >> $GITHUB_ENV
          echo "WEB_URL=$WEB_URL" >> $GITHUB_ENV

          # Tampilkan juga di GitHub Summary sebagai fallback jika Telegram error
          echo "### 🚀 SSH Session Ready" >> $GITHUB_STEP_SUMMARY
          echo "```bash" >> $GITHUB_STEP_SUMMARY
          echo "$SSH_CMD" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "[Web Terminal]($WEB_URL)" >> $GITHUB_STEP_SUMMARY

      - name: Send SSH Access to Telegram
        uses: appleboy/telegram-action@v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🚀 *Sesi SSH GitHub Actions Siap!*
            
            📲 **Salin Perintah Ini ke Termux:**
            ```bash
            ${{ env.SSH_CMD }}
            ```
            
            🌐 **Atau Akses via Web Browser:**
            ${{ env.WEB_URL }}
            
            ⏱️ *Sesi aktif hingga kamu ketik `exit` atau batas 6 jam.*

      - name: Keep Workflow Alive
        run: |
          echo "Sesi SSH aktif. Menunggu koneksi..."
          while tmate -S /tmp/tmate.sock has-session 2>/dev/null; do
            sleep 10
          done
          echo "Sesi tmate telah ditutup."

      - name: Notify Session Ended
        if: always()
        uses: appleboy/telegram-action@v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🛑 *Sesi SSH GitHub Actions telah selesai/ditutup.*
