name: Interactive SSH Runner (Termux/JuiceSSH)

on:
  workflow_dispatch:

jobs:
  ssh-session:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean Space & Setup Swap (Safe Method)
        run: |
          echo "Membersihkan bloatware untuk mengosongkan ruang..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          
          echo "Membuat Swap 4GB..."
          sudo swapoff -a || true
          sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Pre-install Essential Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tmate htop speedtest-cli git aria2 curl wget zip unzip ccache python3-pip
          
          # Install fastfetch via .deb resmi
          curl -sL https://github.com/fastfetch-cli/fastfetch/releases/latest/download/fastfetch-linux-amd64.deb -o fastfetch.deb
          sudo dpkg -i fastfetch.deb
          rm fastfetch.deb

      - name: Start Tmate Session
        run: |
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          
          SSH_CMD=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          WEB_URL=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}')
          
          echo "SSH_CMD=$SSH_CMD" >> $GITHUB_ENV
          echo "WEB_URL=$WEB_URL" >> $GITHUB_ENV

      - name: Send SSH Access to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🚀 *Sesi SSH GitHub Actions Siap!*
            
            📲 **Salin Perintah Ini ke Termux:**
            ```bash
            ${{ env.SSH_CMD }}
            ```
            
            🌐 **Atau Akses via Web Browser:**
            ${{ env.WEB_URL }}
            
            ⏱️ *Sesi aktif hingga kamu ketik `exit` atau batas 6 jam.*

      - name: Keep Workflow Alive
        run: |
          echo "Sesi SSH aktif. Menunggu koneksi..."
          while tmate -S /tmp/tmate.sock has-session 2>/dev/null; do
            sleep 10
          done
          echo "Sesi tmate telah ditutup."

      - name: Notify Session Ended
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🛑 *Sesi SSH GitHub Actions telah selesai/ditutup.*
            
