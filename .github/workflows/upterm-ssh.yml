name: Interactive SSH Runner (Upterm - Termux/JuiceSSH)

on:
  workflow_dispatch:

jobs:
  ssh-session:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean Space & Setup Swap (Safe Method)
        run: |
          echo "Membersihkan bloatware untuk mengosongkan ruang..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          
          echo "Membuat Swap 4GB..."
          sudo swapoff -a || true
          sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Pre-install Essential Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux htop speedtest-cli git aria2 curl wget zip unzip ccache python3-pip file
          
          # Install fastfetch via .deb resmi
          curl -sL https://github.com/fastfetch-cli/fastfetch/releases/latest/download/fastfetch-linux-amd64.deb -o fastfetch.deb
          sudo dpkg -i fastfetch.deb
          rm -f fastfetch.deb

      - name: Setup & Start Upterm Session
        run: |
          echo "Memeriksa dan mendownload Upterm CLI..."
          
          # 1. Ambil tag rilis terbaru via HTTP Redirect (tanpa API rate limit)
          LATEST_TAG=$(curl -sI https://github.com/upterm/upterm/releases/latest | grep -i "^location:" | sed -E 's/.*\/tag\/([^ \r\n]+).*/\1/')
          VERSION=$(echo "$LATEST_TAG" | sed 's/^v//')

          echo "Versi Upterm terdeteksi: $LATEST_TAG"

          # 2. Daftar kemungkinan nama file rilis
          URLS=(
            "https://github.com/upterm/upterm/releases/download/${LATEST_TAG}/upterm_linux_amd64.tar.gz"
            "https://github.com/upterm/upterm/releases/download/${LATEST_TAG}/upterm_${VERSION}_linux_amd64.tar.gz"
            "https://github.com/upterm/upterm/releases/download/${LATEST_TAG}/upterm_v${VERSION}_linux_amd64.tar.gz"
          )

          SUCCESS=false
          for url in "${URLS[@]}"; do
            echo "Mencoba unduh dari: $url"
            curl -sL "$url" -o upterm.tar.gz
            if file upterm.tar.gz | grep -q 'gzip compressed'; then
              tar -xzf upterm.tar.gz
              sudo mv upterm /usr/local/bin/
              sudo chmod +x /usr/local/bin/upterm
              rm -f upterm.tar.gz
              SUCCESS=true
              echo "Berhasil menginstal Upterm biner!"
              break
            fi
          done

          # 3. Fallback: kompilasi via Go jika semua URL biner gagal
          if [ "$SUCCESS" = false ]; then
            echo "Gagal mengunduh biner langsung, melakukan fallback via 'go install'..."
            go install github.com/upterm/upterm/cmd/upterm@latest
            sudo cp ~/go/bin/upterm /usr/local/bin/
            sudo chmod +x /usr/local/bin/upterm
          fi

          echo "Membuat SSH Key untuk Upterm..."
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519

          echo "Menjalankan Upterm di latar belakang (tmux)..."
          tmux new-session -d -s upterm "upterm host --server ssh://uptermd.upterm.dev:22 -- bash"

          # 4. Tunggu sesi Upterm siap (maksimal 15 detik)
          SSH_CMD=""
          for i in {1..15}; do
            sleep 1
            SSH_CMD=$(tmux capture-pane -pt upterm | grep "SSH Session:" | cut -d':' -f2- | xargs)
            if [ -n "$SSH_CMD" ]; then
              break
            fi
          done

          if [ -z "$SSH_CMD" ]; then
            echo "Error: Gagal mendapatkan perintah SSH dari Upterm!"
            tmux capture-pane -pt upterm
            exit 1
          fi

          echo "SSH_CMD=$SSH_CMD" >> $GITHUB_ENV
          echo "Perintah SSH Upterm: $SSH_CMD"

      - name: Send SSH Access to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🚀 *Sesi SSH Upterm GitHub Actions Siap!*
            
            📲 **Salin Perintah Ini ke Termux / JuiceSSH:**
            ```bash
            ${{ env.SSH_CMD }}
            ```
            
            💡 *Server: Upterm Relay (Lebih Stabil & Jarang Drop)*
            ⏱️ *Sesi aktif hingga kamu ketik `exit` atau batas 6 jam.*

      - name: Keep Workflow Alive
        run: |
          echo "Sesi Upterm aktif. Menunggu koneksi..."
          while tmux has-session -t upterm 2>/dev/null; do
            sleep 10
          done
          echo "Sesi Upterm telah ditutup."

      - name: Notify Session Ended
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🛑 *Sesi SSH Upterm GitHub Actions telah selesai/ditutup.*
            
